<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <defs>
    <g id="ok"><circle r="26" fill="#2C4A3C"/><path d="M-11 1-3 9 12-8" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="no"><circle r="26" fill="#C24F3A"/><path d="M-10-10 10 10M10-10-10 10" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/></g>
  </defs>

  <!-- 以前：USB-A -->
  <rect x="30" y="30" width="555" height="500" rx="26" fill="#F0F4F1"/>
  <rect x="187" y="50" width="240" height="60" rx="30" fill="#C24F3A"/><text x="307" y="91" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">以前：USB-A</text>
  <text x="307" y="160" text-anchor="middle" font-size="22" fill="#5D6D65">從插頭正面看</text>
  <rect x="207" y="185" width="200" height="88" rx="6" fill="#C9CFD6" stroke="#1E2B25" stroke-width="5"/>
  <rect x="222" y="198" width="170" height="30" rx="3" fill="#FFFFFF" stroke="#1E2B25" stroke-width="3"/>
  <text x="307" y="300" text-anchor="middle" font-size="20" fill="#5D6D65">塑膠片只在一邊</text>
  <g transform="translate(160 380)">
    <rect x="-38" y="-22" width="76" height="44" rx="5" fill="#C9CFD6" stroke="#1E2B25" stroke-width="4"/><rect x="-30" y="-16" width="60" height="14" rx="2" fill="#FFFFFF" stroke="#1E2B25" stroke-width="2"/>
    <use href="#ok" x="0" y="62"/><text x="0" y="118" text-anchor="middle" font-size="20" fill="#1E2B25">這一面對</text>
  </g>
  <g transform="translate(454 380)">
    <rect x="-38" y="-22" width="76" height="44" rx="5" fill="#C9CFD6" stroke="#1E2B25" stroke-width="4"/><rect x="-30" y="2" width="60" height="14" rx="2" fill="#FFFFFF" stroke="#1E2B25" stroke-width="2"/>
    <use href="#no" x="0" y="62"/><text x="0" y="118" text-anchor="middle" font-size="20" fill="#1E2B25">翻過來就錯</text>
  </g>

  <!-- 後來：USB-C -->
  <rect x="615" y="30" width="555" height="500" rx="26" fill="#F0F4F1"/>
  <rect x="772" y="50" width="240" height="60" rx="30" fill="#2C4A3C"/><text x="892" y="91" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">後來：USB-C</text>
  <text x="892" y="160" text-anchor="middle" font-size="22" fill="#5D6D65">從插頭正面看</text>
  <rect x="772" y="196" width="240" height="66" rx="33" fill="#C9CFD6" stroke="#1E2B25" stroke-width="5"/>
  <rect x="812" y="219" width="160" height="20" rx="10" fill="#FFFFFF" stroke="#1E2B25" stroke-width="3"/>
  <text x="892" y="300" text-anchor="middle" font-size="20" fill="#5D6D65">上下一樣，中間對稱</text>
  <g transform="translate(745 380)">
    <rect x="-44" y="-18" width="88" height="36" rx="18" fill="#C9CFD6" stroke="#1E2B25" stroke-width="4"/><rect x="-28" y="-6" width="56" height="12" rx="6" fill="#FFFFFF" stroke="#1E2B25" stroke-width="2"/>
    <use href="#ok" x="0" y="62"/><text x="0" y="118" text-anchor="middle" font-size="20" fill="#1E2B25">正著插</text>
  </g>
  <g transform="translate(1039 380)">
    <rect x="-44" y="-18" width="88" height="36" rx="18" fill="#C9CFD6" stroke="#1E2B25" stroke-width="4"/><rect x="-28" y="-6" width="56" height="12" rx="6" fill="#FFFFFF" stroke="#1E2B25" stroke-width="2"/>
    <use href="#ok" x="0" y="62"/><text x="0" y="118" text-anchor="middle" font-size="20" fill="#1E2B25">反著插也可以</text>
  </g>

  <text x="600" y="590" text-anchor="middle" font-size="36" font-weight="700" fill="#1E2B25">不是你不會插，是設計改好了</text>
</svg>
