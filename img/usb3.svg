<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <defs>
    <g id="laptop">
      <rect x="0" y="0" width="96" height="150" rx="10" fill="#3B4148" stroke="#1E2B25" stroke-width="4"/>
      <rect x="16" y="18" width="64" height="8" rx="4" fill="#5A626B"/>
      <rect x="70" y="52" width="26" height="46" rx="3" fill="#0F1214"/>
      <rect x="74" y="56" width="22" height="16" rx="2" fill="#2F6FB0"/>
    </g>
    <g id="cable">
      <rect x="60" y="-16" width="90" height="78" rx="16" fill="#3C6E9E" stroke="#1E2B25" stroke-width="4"/>
      <path d="M150 23c26 0 34 20 62 20" fill="none" stroke="#1E2B25" stroke-width="10" stroke-linecap="round"/>
      <path d="M150 23c26 0 34 20 62 20" fill="none" stroke="#3C6E9E" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="plugUp">
      <rect x="0" y="0" width="64" height="46" rx="3" fill="#C9CFD6" stroke="#1E2B25" stroke-width="4"/>
      <rect x="6" y="5" width="44" height="15" rx="2" fill="#FFFFFF" stroke="#1E2B25" stroke-width="2"/>
      <rect x="16" y="28" width="9" height="9" fill="#1E2B25"/><rect x="38" y="28" width="9" height="9" fill="#1E2B25"/>
    </g>
    <g id="plugDown">
      <rect x="0" y="0" width="64" height="46" rx="3" fill="#C9CFD6" stroke="#1E2B25" stroke-width="4"/>
      <rect x="6" y="26" width="44" height="15" rx="2" fill="#FFFFFF" stroke="#1E2B25" stroke-width="2"/>
      <rect x="16" y="9" width="9" height="9" fill="#1E2B25"/><rect x="38" y="9" width="9" height="9" fill="#1E2B25"/>
    </g>
    <g id="xmark"><circle r="34" fill="#C24F3A"/><path d="M-13-13 13 13M13-13-13 13" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="34" fill="#2C4A3C"/><path d="M-15 1-4 12 16-11" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="flip"><path d="M-22 6a22 22 0 1 1 8 14" fill="none" stroke="#E3B544" stroke-width="6" stroke-linecap="round"/><path d="M-30 4-21 18-10 6z" fill="#E3B544"/></g>
  </defs>

  <!-- 第一次 -->
  <rect x="30" y="30" width="365" height="560" rx="26" fill="#F0F4F1"/>
  <rect x="117" y="50" width="190" height="60" rx="30" fill="#C24F3A"/><text x="212" y="91" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">第一次</text>
  <use href="#laptop" x="56" y="205"/>
  <use href="#plugUp" x="172" y="257"/><use href="#cable" x="172" y="257"/>
  <g stroke="#C24F3A" stroke-width="5" stroke-linecap="round"><path d="M158 238l-8-14M166 236l4-15M158 318l-8 14M166 320l4 15"/></g>
  <use href="#xmark" x="212" y="430"/>
  <text x="212" y="515" text-anchor="middle" font-size="24" font-weight="700" fill="#C24F3A">插不進去</text>

  <!-- 第二次 -->
  <rect x="417" y="30" width="365" height="560" rx="26" fill="#F0F4F1"/>
  <rect x="504" y="50" width="190" height="60" rx="30" fill="#C24F3A"/><text x="599" y="91" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">第二次</text>
  <use href="#laptop" x="443" y="205"/>
  <use href="#plugDown" x="559" y="257"/><use href="#cable" x="559" y="257"/>
  <use href="#flip" x="640" y="182"/>
  <use href="#xmark" x="599" y="430"/>
  <text x="599" y="515" text-anchor="middle" font-size="24" font-weight="700" fill="#C24F3A">轉過來，還是插不進去</text>

  <!-- 第三次 -->
  <rect x="804" y="30" width="365" height="560" rx="26" fill="#F0F4F1"/>
  <rect x="891" y="50" width="190" height="60" rx="30" fill="#2C4A3C"/><text x="986" y="91" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">第三次</text>
  <use href="#plugUp" x="902" y="257"/><use href="#cable" x="902" y="257"/>
  <use href="#laptop" x="830" y="205"/>
  <use href="#flip" x="1010" y="182"/>
  <use href="#vmark" x="986" y="430"/>
  <text x="986" y="515" text-anchor="middle" font-size="24" font-weight="700" fill="#2C4A3C">轉回原本的方向……進去了？！</text>

  <text x="600" y="660" text-anchor="middle" font-size="38" font-weight="700" fill="#1E2B25">為什麼 USB 總要轉三次才插得進去？</text>
</svg>
