<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>桌上 QR code｜列印</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
  :root { color-scheme: light; --green: #2C4A3C; --ink: #18261F; --muted: #5D6D65; --line: #D4DDD7; --gold: #E3B544; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #EEF2EF; color: var(--ink); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  .bar { max-width: 210mm; margin: 16px auto; padding: 0 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .bar button { border: 0; border-radius: 10px; padding: 10px 18px; background: var(--green); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .bar p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; min-width: 200px; }
  .sheet { width: 210mm; min-height: 297mm; margin: 0 auto 24px; background: #fff; padding: 10mm; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 0; }
  .card { border: 1px dashed #B9C6BE; padding: 8mm 7mm; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3mm; text-align: center; }
  .card h2 { margin: 0; font-size: 17pt; color: var(--green); }
  .card .qr { width: 52mm; height: 52mm; }
  .card .qr svg { width: 100%; height: 100%; display: block; }
  .card ol { margin: 0; padding-left: 1.3em; text-align: left; font-size: 11pt; line-height: 1.6; }
  .card .url { font-family: "JetBrains Mono", monospace; font-size: 7.5pt; color: var(--muted); word-break: break-all; }
  .card .key { font-size: 9pt; color: var(--muted); }
  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .bar { display: none; }
    .sheet { margin: 0; box-shadow: none; }
  }
  @media screen and (max-width: 840px) { .sheet { transform-origin: top left; width: 100%; min-height: auto; grid-auto-rows: auto; } }
</style>
</head>
<body>
<div class="bar"><button onclick="window.print()">列印</button><p>一張 A4 有 6 張，沿虛線剪開放在各組桌上。同一個班每節都用同一張，不用重印。</p></div>
<div class="sheet" id="sheet"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const key = (q.get("k") || "").trim();
  const label = q.get("l") || "";
  const url = new URL("index.html", location.href).href.split("?")[0] + "?k=" + encodeURIComponent(key);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let svg = "";
  try { const qr = qrcode(0, "M"); qr.addData(url); qr.make(); svg = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true }); } catch (e) { svg = "<p>QR code 產生失敗，請重新整理</p>"; }
  const card = `<div class="card"><h2>${esc(label || "產品設計課堂")}</h2><div class="qr">${svg}</div>
    <ol><li>用 Chromebook 掃描</li><li>輸入自己的座號</li><li>老師還沒開課時，畫面會等著，開課後自動進入</li></ol>
    <div class="key">班級代號 ${esc(key)}</div><div class="url">${esc(url)}</div></div>`;
  document.getElementById("sheet").innerHTML = key ? card.repeat(6) : "<p>網址少了班級代號（k=）。請從老師控制台的「資料」分頁打開這一頁。</p>";
</script>
</body>
</html>
